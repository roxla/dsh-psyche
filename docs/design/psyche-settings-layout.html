<div id="psyche-layout-preview" aria-label="心灵页面布局预览">
  <style>
    #psyche-layout-preview {
      /* 宿主 token 优先；light-dark 仅作独立预览兜底，实际页面不得靠它判断主题。 */
      --lb-bg: var(--dsw-alias-bg-base, light-dark(#f4f6f9, #0b1120));
      --lb-panel: var(--dsw-alias-bg-layer-1, light-dark(#ffffff, #111b2d));
      --lb-nav: var(--dsw-alias-bg-layer-2, light-dark(#edf1f6, #0e1728));
      --lb-text: var(--dsw-alias-label-primary, light-dark(#182338, #e6edf6));
      --lb-muted: var(--dsw-alias-label-secondary, light-dark(#526078, #a3b1c6));
      --lb-line: var(--dsw-alias-border-l1, light-dark(#dce3ed, #2a364b));
      --lb-accent: var(--dsw-alias-brand-primary, light-dark(#087e8b, #67d5e4));
      --lb-soft: color-mix(in srgb, var(--lb-accent) 14%, var(--lb-panel));
      --lb-ok: var(--dsw-alias-state-success-primary, light-dark(#1d704f, #80dab2));
      --lb-ok-bg: color-mix(in srgb, var(--lb-ok) 12%, var(--lb-panel));
      --lb-warn: var(--dsw-alias-state-warn-primary, light-dark(#8b5908, #ecc47d));
      --lb-warn-bg: color-mix(in srgb, var(--lb-warn) 12%, var(--lb-panel));
      --lb-error: var(--dsw-alias-state-error-primary, light-dark(#ad3b45, #f5a1a9));
      --lb-error-bg: color-mix(in srgb, var(--lb-error) 12%, var(--lb-panel));
      --lb-radius: 10px;
      --lb-space: 20px;
      color: var(--lb-text);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      width: 100%;
      text-align: left;
    }
    #psyche-layout-preview * { box-sizing: border-box; }
    #psyche-layout-preview [hidden] { display: none !important; }
    #psyche-layout-preview h2, #psyche-layout-preview h3, #psyche-layout-preview p { margin: 0; }
    #psyche-layout-preview button, #psyche-layout-preview select, #psyche-layout-preview input { font: inherit; }
    #psyche-layout-preview button, #psyche-layout-preview select { color: inherit; }
    #psyche-layout-preview button { cursor: pointer; }
    #psyche-layout-preview button:focus-visible, #psyche-layout-preview select:focus-visible, #psyche-layout-preview input:focus-visible, #psyche-layout-preview summary:focus-visible { outline: 2px solid var(--lb-accent); outline-offset: 3px; }
    #psyche-layout-preview .lb-window { background: var(--lb-bg); border: 1px solid var(--lb-line); border-radius: 12px; overflow: clip; }
    #psyche-layout-preview .lb-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 64px; padding: 16px 24px; border-bottom: 1px solid var(--lb-line); }
    #psyche-layout-preview .lb-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    #psyche-layout-preview .lb-monogram { width: 28px; height: 28px; display: grid; place-items: center; background: var(--lb-soft); color: var(--lb-accent); border-radius: 7px; font-size: 16px; }
    #psyche-layout-preview .lb-top-caption { color: var(--lb-muted); font-size: 12px; }
    #psyche-layout-preview .lb-demo { margin-left: auto; margin-right: 76px; color: var(--lb-muted); font-size: 12px; }
    #psyche-layout-preview .lb-shell { display: grid; grid-template-columns: 164px minmax(0, 1fr); min-height: 570px; }
    #psyche-layout-preview .lb-side { background: var(--lb-nav); border-right: 1px solid var(--lb-line); padding: 20px 12px; display: flex; flex-direction: column; gap: 5px; }
    #psyche-layout-preview .lb-side-label { color: var(--lb-muted); font-size: 12px; padding: 0 12px 8px; }
    #psyche-layout-preview .lb-nav-button { appearance: none; border: 0; background: transparent; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 9px; text-align: left; width: 100%; white-space: nowrap; }
    #psyche-layout-preview .lb-nav-button:hover { background: var(--lb-panel); }
    #psyche-layout-preview .lb-nav-button[aria-current="page"] { background: var(--lb-soft); color: var(--lb-accent); font-weight: 600; }
    #psyche-layout-preview .lb-nav-button svg { width: 16px; height: 16px; flex-shrink: 0; }
    #psyche-layout-preview .lb-nav-gap { height: 18px; }
    #psyche-layout-preview .lb-side-foot { margin-top: auto; padding: 28px 12px 0; color: var(--lb-muted); font-size: 12px; }
    #psyche-layout-preview .lb-mobile-nav { display: none; }
    #psyche-layout-preview .lb-main { padding: 24px; min-width: 0; }
    #psyche-layout-preview .lb-breadcrumb { color: var(--lb-muted); font-size: 12px; margin-bottom: 8px; }
    #psyche-layout-preview .lb-heading { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    #psyche-layout-preview .lb-heading h2 { font-size: 22px; font-weight: 600; line-height: 1.35; }
    #psyche-layout-preview .lb-subtitle { color: var(--lb-muted); margin-top: 6px; font-size: 13px; }
    #psyche-layout-preview .lb-button { appearance: none; background: var(--lb-panel); border: 1px solid var(--lb-line); border-radius: 6px; padding: 7px 12px; min-height: 36px; white-space: normal; flex-shrink: 0; text-align: center; }
    #psyche-layout-preview .lb-button-primary { background: var(--lb-accent-soft); color: var(--lb-text); border-color: var(--lb-accent); font-weight: 600; }
    #psyche-layout-preview .lb-button:disabled { cursor: not-allowed; color: var(--lb-muted); background: var(--lb-nav); }
    #psyche-layout-preview .lb-categories { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--lb-line); padding-bottom: 14px; margin-bottom: 20px; }
    #psyche-layout-preview .lb-category { appearance: none; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; min-height: 34px; color: var(--lb-muted); }
    #psyche-layout-preview .lb-category[aria-pressed="true"] { background: var(--lb-soft); color: var(--lb-accent); }
    #psyche-layout-preview .lb-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    #psyche-layout-preview .lb-panel { background: var(--lb-panel); border: 1px solid var(--lb-line); border-radius: var(--lb-radius); padding: var(--lb-space); min-width: 0; }
    #psyche-layout-preview .lb-span { grid-column: 1 / -1; }
    #psyche-layout-preview .lb-panel-head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    #psyche-layout-preview h3 { font-size: 15px; font-weight: 600; }
    #psyche-layout-preview .lb-caption { color: var(--lb-muted); font-size: 12px; }
    #psyche-layout-preview .lb-row { padding: 16px 0; border-bottom: 1px solid var(--lb-line); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    #psyche-layout-preview .lb-row:last-child { border-bottom: 0; padding-bottom: 0; }
    #psyche-layout-preview .lb-row-copy { min-width: 0; }
    #psyche-layout-preview .lb-row-label { font-size: 14px; }
    #psyche-layout-preview .lb-row-help { color: var(--lb-muted); font-size: 12px; margin-top: 4px; }
    #psyche-layout-preview .lb-value { text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; max-width: 52%; overflow-wrap: anywhere; }
    #psyche-layout-preview .lb-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 7px; background: var(--lb-nav); color: var(--lb-muted); border-radius: 4px; white-space: nowrap; }
    #psyche-layout-preview .lb-badge-ok { background: var(--lb-ok-bg); color: var(--lb-ok); }
    #psyche-layout-preview .lb-badge-warn { background: var(--lb-warn-bg); color: var(--lb-warn); }
    #psyche-layout-preview .lb-badge-error { background: var(--lb-error-bg); color: var(--lb-error); }
    #psyche-layout-preview .lb-check { appearance: none; width: 34px; height: 20px; margin: 0; background: var(--lb-nav); border: 1px solid var(--lb-line); border-radius: 12px; flex-shrink: 0; cursor: pointer; }
    #psyche-layout-preview .lb-check::before { content: ''; display: block; width: 12px; height: 12px; margin: 3px; border-radius: 50%; background: var(--lb-muted); }
    #psyche-layout-preview .lb-check:checked { background: var(--lb-accent); border-color: var(--lb-accent); }
    #psyche-layout-preview .lb-check:checked::before { transform: translateX(14px); background: var(--lb-panel); }
    #psyche-layout-preview .lb-select { background: var(--lb-panel); border: 1px solid var(--lb-line); border-radius: 6px; min-height: 36px; padding: 6px 8px; max-width: 100%; }
    #psyche-layout-preview .lb-feedback { min-height: 20px; font-size: 12px; color: var(--lb-accent); margin-top: 14px; }
    #psyche-layout-preview .lb-note { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--lb-soft); color: var(--lb-text); border-radius: 6px; margin-bottom: 16px; }
    #psyche-layout-preview .lb-note p { font-size: 13px; }
    #psyche-layout-preview .lb-summary-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
    #psyche-layout-preview .lb-metric { background: var(--lb-panel); border: 1px solid var(--lb-line); border-radius: var(--lb-radius); padding: 16px; min-width: 0; }
    #psyche-layout-preview .lb-metric-value { font-size: 23px; line-height: 1.3; font-weight: 500; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
    #psyche-layout-preview .lb-metric-label { color: var(--lb-muted); font-size: 12px; }
    #psyche-layout-preview .lb-table-wrap { width: 100%; overflow-x: auto; }
    #psyche-layout-preview table { border-collapse: collapse; width: 100%; font-size: 13px; text-align: left; }
    #psyche-layout-preview th { font-weight: 400; color: var(--lb-muted); padding: 12px 10px; border-bottom: 1px solid var(--lb-line); }
    #psyche-layout-preview td { padding: 14px 10px; border-bottom: 1px solid var(--lb-line); }
    #psyche-layout-preview tbody tr:last-child td { border-bottom: 0; }
    #psyche-layout-preview td:last-child { font-variant-numeric: tabular-nums; }
    #psyche-layout-preview .lb-spaced { margin-top: 16px; }
    #psyche-layout-preview .lb-stack { display: grid; gap: 16px; }
    #psyche-layout-preview .lb-empty { padding: 28px 8px; text-align: center; color: var(--lb-muted); font-size: 13px; }
    #psyche-layout-preview .lb-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    #psyche-layout-preview details > summary { padding: 12px 0; cursor: pointer; color: var(--lb-muted); font-size: 13px; }
    #psyche-layout-preview .lb-log { display: grid; gap: 12px; margin-top: 16px; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; color: var(--lb-muted); }
    #psyche-layout-preview .lb-footer { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--lb-line); font-size: 12px; color: var(--lb-muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }
    @media (max-width: 820px) {
      #psyche-layout-preview .lb-shell { grid-template-columns: 144px minmax(0, 1fr); }
      #psyche-layout-preview .lb-main { padding: 20px; }
      #psyche-layout-preview .lb-grid { grid-template-columns: minmax(0, 1fr); }
      #psyche-layout-preview .lb-heading { flex-wrap: wrap; }
      #psyche-layout-preview .lb-summary-row { gap: 10px; }
    }
    @media (max-width: 560px) {
      #psyche-layout-preview .lb-top { padding: 14px 16px; }
      #psyche-layout-preview .lb-demo { margin-left: 0; margin-right: 0; width: 100%; }
      #psyche-layout-preview .lb-top-caption { display: none; }
      #psyche-layout-preview .lb-shell { display: block; min-height: 0; }
      #psyche-layout-preview .lb-side { display: none; }
      #psyche-layout-preview .lb-mobile-nav { display: flex; gap: 12px; align-items: center; padding: 14px 16px 0; }
      #psyche-layout-preview .lb-mobile-nav select { flex: 1; min-width: 0; }
      #psyche-layout-preview .lb-main { padding: 20px 16px; }
      #psyche-layout-preview .lb-row { gap: 10px; align-items: flex-start; flex-wrap: wrap; }
      #psyche-layout-preview .lb-row-copy { flex: 1 1 150px; }
      #psyche-layout-preview .lb-value { max-width: 100%; }
      #psyche-layout-preview .lb-summary-row { grid-template-columns: minmax(0, 1fr); }
      #psyche-layout-preview .lb-note { align-items: flex-start; flex-wrap: wrap; }
      #psyche-layout-preview .lb-heading h2 { font-size: 20px; }
      #psyche-layout-preview .lb-panel { padding: 16px; }
    }
    @media (pointer: coarse) {
      #psyche-layout-preview button, #psyche-layout-preview select, #psyche-layout-preview summary { min-height: 44px; }
      #psyche-layout-preview input, #psyche-layout-preview select { font-size: 16px; }
      #psyche-layout-preview label.lb-row { min-height: 52px; }
    }
  </style>
  <div class="lb-window">
    <header class="lb-top">
      <div class="lb-brand"><span class="lb-monogram" aria-hidden="true">L</span><span>心灵</span></div>
      <span class="lb-top-caption">记忆与交互工作台</span>
      <span class="lb-demo">布局预览 · 示例数据</span>
    </header>
    <div class="lb-shell">
      <nav class="lb-side" aria-label="功能导航">
        <span class="lb-side-label">工作台</span>
        <button class="lb-nav-button" type="button" data-page="overview"><i data-lucide="layout-dashboard" aria-hidden="true"></i>概览</button>
        <button class="lb-nav-button" type="button" data-page="memory"><i data-lucide="brain" aria-hidden="true"></i>记忆</button>
        <button class="lb-nav-button" type="button" data-page="emotion"><i data-lucide="heart-pulse" aria-hidden="true"></i>情绪与关系</button>
        <button class="lb-nav-button" type="button" data-page="qq"><i data-lucide="message-circle" aria-hidden="true"></i>QQ 通道</button>
        <button class="lb-nav-button" type="button" data-page="usage"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>用量与花费</button>
        <div class="lb-nav-gap"></div>
        <span class="lb-side-label">管理</span>
        <button class="lb-nav-button" type="button" data-page="settings" aria-current="page"><i data-lucide="settings-2" aria-hidden="true"></i>设置</button>
        <button class="lb-nav-button" type="button" data-page="ops"><i data-lucide="wrench" aria-hidden="true"></i>运维与诊断</button>
        <div class="lb-side-foot">统一布局提案</div>
      </nav>
      <div>
        <label class="lb-mobile-nav"><span class="lb-caption">页面</span><select class="lb-select" data-mobile-nav aria-label="选择页面"><option value="overview">概览</option><option value="memory">记忆</option><option value="emotion">情绪与关系</option><option value="qq">QQ 通道</option><option value="usage">用量与花费</option><option value="settings" selected>设置</option><option value="ops">运维与诊断</option></select></label>
        <main class="lb-main">
          <div class="lb-breadcrumb" data-breadcrumb>管理 / 设置</div>
          <div class="lb-heading">
            <div><h2 data-title>设置</h2><p class="lb-subtitle" data-subtitle>常用偏好与运行参数，各有清楚的修改位置。</p></div>
            <button class="lb-button lb-button-primary" type="button" data-host-settings>宿主插件设置 ↗</button>
          </div>
          <div class="lb-note" data-host-help hidden><p>运行配置在「宿主设置 → 插件 → 心灵」中修改；此预览不会打开宿主或保存配置。</p></div>
          <div data-categories class="lb-categories" aria-label="页面分类"></div>
          <div data-content></div>
          <div class="lb-feedback" data-feedback role="status" aria-live="polite"></div>
          <footer class="lb-footer"><span>布局与交互预览，所有数值均为示例。</span><span>群回复保持关闭</span></footer>
        </main>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('psyche-layout-preview');
  if (!root) return;
  const content = root.querySelector('[data-content]');
  const categories = root.querySelector('[data-categories]');
  const feedback = root.querySelector('[data-feedback]');
  const saved = globalThis.openai?.widgetState;
  const initial = saved?.modelContent || {};
  const ui = { page: 'settings', category: 'common', sea: false, discipline: 'inherit' };
  const pages = {
    overview: ['概览', '运行状态、关键数据与需要处理的事项。', []],
    memory: ['记忆', '记忆规模、重要结论与实际使用情况。', [['summary','记忆概况'],['proposals','设定提案'],['sea','意识海']]],
    emotion: ['情绪与关系', '语气、联系人与成长状态，按来源分别展示。', [['mood','情绪'],['contacts','关系'],['growth','成长']]],
    qq: ['QQ 通道', '连接、准入与群聊状态，集中查看。', [['private','连接与私聊'],['groups','群聊'],['logs','运行日志']]],
    usage: ['用量与花费', '仅统计心灵自身任务，不含对话本身的消耗。', []],
    settings: ['设置', '常用偏好与运行参数，各有清楚的修改位置。', [['common','常用'],['capture','采集与记忆'],['affect','情绪与关系'],['qq','QQ 与群聊'],['advanced','存储与高级']]],
    ops: ['运维与诊断', '健康、自检与备份；运行信息按需展开。', []]
  };
  const optionsFor = page => pages[page][2].filter(x=>page!=='memory'||x[0]!=='sea'||ui.sea);
  const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const badge = (label, state='') => `<span class="lb-badge${state ? ' lb-badge-'+state : ''}">${escape(label)}</span>`;
  const row = (label, value, help='') => `<div class="lb-row"><div class="lb-row-copy"><div class="lb-row-label">${escape(label)}</div>${help ? `<div class="lb-row-help">${escape(help)}</div>` : ''}</div><div class="lb-value">${value}</div></div>`;
  const panel = (title, body, mark='', extra='') => `<section class="lb-panel ${extra}"><div class="lb-panel-head"><h3>${escape(title)}</h3>${mark}</div>${body}</section>`;
  const table = (headers, rows) => `<div class="lb-table-wrap"><table><thead><tr>${headers.map(x=>`<th scope="col">${escape(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(cells=>`<tr>${cells.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const metric = (label,value,help) => `<div class="lb-metric"><div class="lb-metric-label">${escape(label)}</div><div class="lb-metric-value">${escape(value)}</div><div class="lb-caption">${escape(help)}</div></div>`;
  const note = text => `<div class="lb-note"><p>${escape(text)}</p></div>`;
  const advanced = (title,body) => `<details class="lb-spaced"><summary>${escape(title)}</summary>${body}</details>`;
  const settingsRows = entries => entries.map(x=>row(x[0],escape(x[1]),x[2]||'')).join('');
  function commonSettings() {
    return `<div class="lb-grid">` + panel('显示与偏好',
      `<label class="lb-row"><div class="lb-row-copy"><div class="lb-row-label">显示意识海</div><div class="lb-row-help">显示后可从记忆页面进入。</div></div><input class="lb-check" type="checkbox" data-pref-sea aria-label="显示意识海" ${ui.sea?'checked':''}></label>` +
      `<label class="lb-row"><div class="lb-row-copy"><div class="lb-row-label">记忆写入纪律</div><div class="lb-row-help">选择跟随配置，或单独调整纪律提示。</div></div><select class="lb-select" data-pref-discipline aria-label="记忆写入纪律"><option value="inherit" ${ui.discipline==='inherit'?'selected':''}>跟随配置</option><option value="on" ${ui.discipline==='on'?'selected':''}>开启</option><option value="off" ${ui.discipline==='off'?'selected':''}>关闭</option></select></label>`, badge('立即生效','ok')) +
      panel('运行状态',row('插件',badge('启用','ok'))+row('自动采集',badge('开启','ok'))+row('自动注入',badge('开启','ok'))+row('最终完整性检查',badge('始终开启'),'随每次注入执行，不提供关闭开关。'),badge('只读')) +
      panel('配置修改位置', `<div class="lb-row"><div class="lb-row-copy"><div class="lb-row-label">运行参数在宿主插件设置中修改</div><div class="lb-row-help">采集、模型、白名单和存储参数使用同一个配置入口。</div></div><button class="lb-button" type="button" data-host-settings>前往设置 ↗</button></div>`,badge('重启生效'), 'lb-span') + '</div>';
  }
  function renderSettings() {
    if(ui.category==='common') return commonSettings();
    if(ui.category==='capture') return `<div class="lb-grid">` + panel('采集', settingsRows([['自动采集','开启','只生成来源，不等于形成结论。'],['独立证据窗口','10 分钟'],['正文上限','8000 字符']])+advanced('队列与补采',settingsRows([['队列上限','200 条'],['上一轮漏采恢复','关闭'],['日志顺序补采','关闭']])),badge('宿主配置')) + panel('自动注入',settingsRows([['自动注入','开启'],['每次最多','6 条'],['正文预算','800 字符']])+advanced('候选与范围',settingsRows([['检索候选上限','12 条'],['范围与披露','按当前会话校验']])),badge('重启生效')) + '</div>';
    if(ui.category==='affect') return `<div class="lb-grid">` + panel('情绪',settingsRows([['情绪功能','开启','影响语气表达。'],['单轮变化上限','8'],['参与正文上限','4000 字符']]),badge('重启生效')) + panel('关系',settingsRows([['关系投影','开启','仅对具有可信绑定的 QQ 私聊生效。'],['好感与信任','只读档位','关系状态不授予通道或发送权限。']]),badge('只读')) + '</div>';
    if(ui.category==='qq') return note('群回复保持关闭：模型输入校验尚未就绪。') + `<div class="lb-grid">` + panel('QQ 连接与准入',settingsRows([['QQ 桥','未启用'],['私聊准入','主人与额外白名单'],['未授权私聊','拒绝']])+advanced('连接参数',settingsRows([['模型路由','沿用宿主配置'],['连接凭据','已隐藏'],['重连初始间隔','3 秒']])),badge('宿主配置')) + panel('群白名单',settingsRows([['群采集总开关','关闭'],['回复总状态','关闭'],['配置入口','宿主插件设置']])+`<div class="lb-spaced"><button class="lb-button" type="button" data-go-page="qq" data-go-category="groups">查看群聊状态 →</button></div>`,badge('只读')) + '</div>';
    return `<div class="lb-grid">`+panel('存储',settingsRows([['数据库驱动','自动选择'],['库文件','memory.sqlite3'],['数据目录','使用默认位置','完整路径按需在受控详情中查看。']]),badge('重启生效'))+panel('高级参数',advanced('性能阈值',settingsRows([['慢查询记录','50 ms'],['慢查询警告','200 ms']]))+advanced('提示与兼容性',settingsRows([['纪律提示顺序','60'],['最终完整性检查','始终开启']])),badge('宿主配置'))+'</div>';
  }
  function renderOverview() {
    return `<div class="lb-summary-row">${metric('记忆库','就绪','最近快照 · 示例')}${metric('QQ 桥','未启用','群回复关闭')}${metric('待处理提案','0','设定提案')}</div><div class="lb-grid">`+
      panel('记忆规模',settingsRows([['来源','1280'],['事件','312'],['结论','86']])+`<div class="lb-spaced"><button class="lb-button" type="button" data-go-page="memory">查看记忆 →</button></div>`,badge('当前库'))+
      panel('当前状态',row('当前语气','平稳')+row('成长阶段','信任')+row('自动注入',badge('开启','ok'))+`<div class="lb-spaced"><button class="lb-button" type="button" data-go-page="emotion">查看情绪与关系 →</button></div>`) +
      panel('需要处理',row('群聊回复尚未就绪',badge('保持关闭','warn'),'生产模型输入校验接入后，再按测试计划开启。'),'', 'lb-span')+'</div>';
  }
  function renderMemory() {
    if(ui.category==='proposals') return panel('设定提案','<div class="lb-empty">没有待处理提案</div>',badge('0 条'));
    if(ui.category==='sea') return panel('意识海', ui.sea ? '<div class="lb-empty">图谱将在此展示，详情保持同一套文字与颜色规范。</div>' : '<div class="lb-empty">意识海未显示；可在设置中打开。</div>') + `<div class="lb-spaced"><button class="lb-button" type="button" data-go-page="settings">查看显示偏好 →</button></div>`;
    return `<div class="lb-summary-row">${metric('来源','1280','原始互动')}${metric('事件','312','整理后的事件')}${metric('结论','86','具有证据的记忆')}</div>` + panel('重要结论',table(['内容','类型','状态'],[['偏好简洁、直接的表达','偏好',badge('有效','ok')],['约定在讨论前确认范围','约定',badge('有效','ok')]])) + '<div class="lb-spaced">'+panel('注入预览','<div class="lb-empty">按当前会话范围与预算展示；未发生注入时不生成演示内容。</div>')+'</div>';
  }
  function renderEmotion() {
    if(ui.category==='contacts') return panel('联系人关系',table(['联系人','通道','关系档位','信任'],[['联系人甲','QQ','友善','未评估'],['联系人乙','QQ','中立','未评估']]),badge('只读档位'));
    if(ui.category==='growth') return panel('成长',row('当前阶段','信任')+row('条件评估','按服务端结果展示')+row('后续阶段','自主 → 主动 → 整合'),'');
    return `<div class="lb-grid">` + panel('当前语气',row('语气','平稳','根据最近一次真实状态快照展示。'),badge('只读')) + panel('情绪趋势','<div class="lb-empty">暂无历史快照；不绘制占位曲线。</div>') + panel('维度明细',advanced('展开 33 维状态','<div class="lb-caption">真实接入后按既有三组展示；没有数据的维度标注未知。</div>'),'', 'lb-span') + '</div>';
  }
  function renderQq() {
    if(ui.category==='groups') return note('模型输入校验尚未就绪，群回复保持关闭。') + panel('群白名单',table(['群','采集','回复','时区'],[['讨论群 A<br><span class="lb-caption">41****01 · 示例</span>','仅被点名',badge('关闭'),'Asia/Shanghai'],['讨论群 B<br><span class="lb-caption">41****02 · 示例</span>','仅被点名',badge('关闭'),'Asia/Shanghai']])+advanced('查看群策略详情',settingsRows([['群采集总开关','关闭'],['确定性触发','@ / 点名 / 引用机器人'],['合并等待','安静 2 秒 / 最长 8 秒'],['静默时段','按每群配置'],['未知发送结果','保留核验，不自动重发']])+`<div class="lb-spaced"><button class="lb-button" type="button" data-host-settings>管理群白名单 ↗</button></div>`),badge('示例配置'));
    if(ui.category==='logs') return panel('运行日志','<div class="lb-caption">本进程最近记录 · 已脱敏</div><div class="lb-log"><div>14:20:08　INFO　QQ 桥未启用</div><div>14:20:08　INFO　群回复保持关闭</div></div>');
    return `<div class="lb-grid">`+panel('桥接与账号',row('桥接',badge('未启用'))+row('账号状态','未知')+row('账号标识','—')+row('上次心跳','—'))+panel('私聊准入',row('主人','34****95 · 示例')+row('额外白名单','1 人 · 示例')+row('未知来源','拒绝'),badge('只读'))+panel('消息计数',table(['收到事件','交付 Host','未授权事件','拒绝回复'],[['0','0','0','0']])+advanced('查看全部计数',settingsRows([['限频丢弃','0'],['拒绝发送错误','0'],['其他发送错误','0'],['超范围丢弃','0']])),badge('本次启动以来'),'lb-span')+'</div>';
  }
  function renderUsage() {
    return `<div class="lb-summary-row">${metric('调用','24','最近 7 天 · 示例')}${metric('Token','18420','输入与输出合计 · 示例')}${metric('估算花费','未定价','未配置价格时不显示为 0')}</div>`+panel('任务明细',table(['任务','调用','Token','费用'],[['记忆整理','16','12280','未定价'],['其他记忆任务','8','6140','未定价']]),badge('心灵自身任务'));
  }
  function renderOps() {
    return `<div class="lb-grid">`+panel('健康与自检',row('数据库',badge('可读取','ok'))+row('启动自检',badge('通过','ok'))+advanced('查看运行信息',settingsRows([['Schema','v23'],['人格数量','1'],['存储位置','默认数据目录']])),badge('快照示例'))+panel('备份','<div class="lb-empty">暂无备份记录</div><button class="lb-button" type="button" disabled>创建备份（预览不可执行）</button>')+panel('受控操作',advanced('迁移与恢复','<p class="lb-caption">保留现有准备、校验、确认与下次启动恢复流程；有影响的操作不会放在概览中。</p><div class="lb-spaced"><button class="lb-button" type="button" disabled>准备恢复（预览不可执行）</button></div>'),'', 'lb-span')+'</div>';
  }
  function normalize(value) {
    if(!value || typeof value!=='object') return;
    if(Object.hasOwn(pages,value.page)) ui.page=value.page;
    const options=optionsFor(ui.page);
    ui.category=options.some(x=>x[0]===value.category)?value.category:(options[0]?.[0]||'');
    if(typeof value.sea==='boolean') ui.sea=value.sea;
    if(['inherit','on','off'].includes(value.discipline)) ui.discipline=value.discipline;
  }
  function remember() {
    if(globalThis.openai?.setWidgetState) globalThis.openai.setWidgetState({modelContent:{...ui},privateContent:null}).catch(()=>{});
  }
  function render() {
    const [title,subtitle]=pages[ui.page];
    const options=optionsFor(ui.page);
    root.querySelector('[data-title]').textContent=title;
    root.querySelector('[data-subtitle]').textContent=subtitle;
    root.querySelector('[data-breadcrumb]').textContent=(['settings','ops'].includes(ui.page)?'管理':'工作台')+' / '+title;
    root.querySelector('[data-mobile-nav]').value=ui.page;
    root.querySelectorAll('.lb-nav-button').forEach(el=>{if(el.dataset.page===ui.page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
    categories.hidden=options.length===0;
    categories.innerHTML=options.map(([key,label])=>`<button class="lb-category" type="button" data-category="${key}" aria-pressed="${ui.category===key}">${label}</button>`).join('');
    const renderers={overview:renderOverview,memory:renderMemory,emotion:renderEmotion,qq:renderQq,usage:renderUsage,settings:renderSettings,ops:renderOps};
    content.innerHTML=renderers[ui.page]();
    feedback.textContent='';
    if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}});
  }
  function go(page,category) {
    if(!Object.hasOwn(pages,page)) return;
    ui.page=page;
    const options=optionsFor(page);
    ui.category=options.some(x=>x[0]===category)?category:(options[0]?.[0]||'');
    root.querySelector('[data-host-help]').hidden=true;
    render();remember();
  }
  root.addEventListener('click',event=>{
    const target=event.target.closest('button');
    if(!target || !root.contains(target)) return;
    if(target.hasAttribute('data-host-settings')) {const help=root.querySelector('[data-host-help]');help.hidden=!help.hidden;return;}
    if(target.dataset.page) {go(target.dataset.page);return;}
    if(target.dataset.goPage) {go(target.dataset.goPage,target.dataset.goCategory);return;}
    if(target.dataset.category) {ui.category=target.dataset.category;render();remember();}
  });
  root.addEventListener('change',event=>{
    const el=event.target;
    if(el.hasAttribute('data-mobile-nav')) {go(el.value);return;}
    if(el.hasAttribute('data-pref-sea')) ui.sea=el.checked;
    else if(el.hasAttribute('data-pref-discipline')) ui.discipline=el.value;
    else return;
    feedback.textContent='预览已更新；未修改实际配置。';remember();
  });
  globalThis.addEventListener('openai:set_globals',event=>{
    const next=event.detail?.globals?.widgetState?.modelContent;
    if(next) {normalize(next);render();}
  });
  normalize(initial);render();
  if(globalThis.Tweak) {
    const design={appearance:'host',density:'comfortable',radius:10};
    const tweak=new globalThis.Tweak({container:root,onChange:()=>{
      root.style.colorScheme=design.appearance==='host'?'inherit':design.appearance;
      root.style.setProperty('--lb-space',design.density==='compact'?'16px':'20px');
      root.style.setProperty('--lb-radius',design.radius+'px');
    }});
    tweak.addSelect(design,'appearance',{label:'预览主题',options:[{label:'跟随宿主',value:'host'},{label:'深色',value:'dark'},{label:'浅色',value:'light'}]});
    tweak.addSelect(design,'density',{label:'内容密度',options:[{label:'舒适',value:'comfortable'},{label:'紧凑',value:'compact'}]});
    tweak.addSlider(design,'radius',{label:'面板圆角',min:6,max:14,step:2,unit:'px'});
  }
})();
</script>
